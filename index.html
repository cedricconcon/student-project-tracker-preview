<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <main class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-6xl">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📋 STUDENT PROJECT TRACKER</h1>
        </header>

        <section class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-8">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">Add a New Project</h2>
            <form id="projectForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="projectName" placeholder="Project name" required 
                       class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400">
                <input type="text" id="projectDescription" placeholder="Description" 
                       class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400">
                <select id="projectStatus" 
                        class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400">
                    <option value="Not Started">Not Started</option>
                    <option value="In Progress" selected>In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <input type="date" id="projectDueDate" required 
                       class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400">
                
                <div class="md:col-span-4">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition" id="addBtn">
                        Add Project
                    </button>
                </div>
            </form>
        </section>

        <section>
            <h2 class="text-lg font-semibold text-gray-700 mb-3">Your Projects</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" id="nameproj">Name</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" id="descproj">Description</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" id="statproj">Status</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" id="dueproj">Due Date</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase" id="actproj">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
                <p id="emptyMessage" class="text-center text-gray-400 py-6">No projects yet. Add one above!</p>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
